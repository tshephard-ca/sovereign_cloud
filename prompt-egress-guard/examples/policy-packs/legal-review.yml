policy_id: legal_review
policy_version: 1
mode: enforce
monitored_sites:
  - site_id: public_ai_1
    display_name: Public AI Site 1
    host_permissions:
      - "https://public-ai-1.example.invalid/*"
    prompt_selectors:
      - "textarea"
      - "[contenteditable='true']"
    submit_selectors:
      - "button[type='submit']"
    keyboard_submit:
      ctrl_enter: true
      cmd_enter: true
      plain_enter: false
approved_destination:
  mode: open_url
  url: "https://approved-ai.example.invalid/"
  include_prompt: false
  include_reason_codes: true
  include_handoff_id: true
  unsafe_prompt_transfer_acknowledgement: false
  clipboard_copy_allowed: false
actions:
  default_action: ALLOW
  thresholds:
    warn_score: 20
    redirect_score: 40
    block_score: 70
  category_actions:
    secrets: BLOCK
    source_code: WARN
    customer_records: REDIRECT
    health_data: BLOCK
    legal_text: REDIRECT
    internal_identifiers: WARN
    personal_data: WARN
    financial_data: BLOCK
audit:
  enabled: true
  store_raw_prompt: false
  store_redacted_excerpt: true
scanner:
  max_prompt_chars: 24000
  entropy_threshold: 4.2
  min_secret_length: 20
  confidence_floor_for_block: MEDIUM
user_experience:
  show_reason_codes: true
  allow_continue_on_warn: true
  allow_continue_on_redirect: false
  allow_continue_on_block: false
  overlay_title: "Sensitive prompt risk detected"
dnr:
  enabled: false
