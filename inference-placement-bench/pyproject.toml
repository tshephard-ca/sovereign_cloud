[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-placement-bench"
version = "0.1.0"
description = "Local-first HTTP inference endpoint micro-benchmark for review-only placement recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "inference-placement-bench contributors" }]
dependencies = [
  "typer>=0.9",
  "pydantic>=2",
  "pyyaml>=6",
  "httpx>=0.24",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
inference-placement-bench = "inference_placement_bench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
