[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s3-compat-replay"
version = "0.1.0"
description = "Local-first semantic replay for S3-compatible object-storage compatibility checks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "s3-compat-replay contributors" }]
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "pyyaml>=6",
  "boto3>=1.34",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
s3-compat-replay = "s3_compat_replay.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s3_compat_replay = ["policy_packs/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
