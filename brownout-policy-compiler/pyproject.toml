[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brownout-policy-compiler"
version = "0.1.0"
description = "Local-only compiler for review-only temporary brownout policy packages."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "brownout-policy-compiler contributors" }]
dependencies = [
  "typer>=0.9",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
brownout-policy-compiler = "brownout_policy_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

