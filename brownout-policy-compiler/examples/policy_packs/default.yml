pack_id: default
description: Default conservative brownout policy pack.

ttl:
  default_minutes: 30
  p0_max_minutes: 30
  p1_max_minutes: 30
  p2_max_minutes: 20
  p3_max_minutes: 15
  p4_max_minutes: 15
  null_route_max_minutes: 10

rate_limit_profiles:
  protect_critical_udp:
    description: Conservative untrusted UDP limit for critical services.
    abstract_rate: low
    applies_to:
      - udp
  public_web_low_priority:
    description: Reduce low-priority public web traffic.
    abstract_rate: medium
    applies_to:
      - tcp

action_preferences:
  P0:
    - ALLOW_TRUSTED_SOURCES
    - PRIORITIZE
    - RATE_LIMIT_UNTRUSTED
  P1:
    - ALLOW_TRUSTED_SOURCES
    - PRIORITIZE
    - RATE_LIMIT_UNTRUSTED
  P2:
    - RATE_LIMIT
    - DEPRIORITIZE
  P3:
    - RATE_LIMIT
    - SHED_LOW_PRIORITY
  P4:
    - SHED_LOW_PRIORITY
    - RATE_LIMIT

risk_defaults:
  TEMPORARY_NULL_ROUTE: CRITICAL
  DENY_UNTRUSTED: HIGH
  TEMPORARY_BLOCK_PORT: HIGH
  RATE_LIMIT_UNTRUSTED: MEDIUM
  RATE_LIMIT: MEDIUM
  SHED_LOW_PRIORITY: MEDIUM
  PRIORITIZE: LOW
  ALLOW_TRUSTED_SOURCES: LOW
  DEPRIORITIZE: MEDIUM
  CHALLENGE: MEDIUM
  MONITOR_ONLY: LOW

