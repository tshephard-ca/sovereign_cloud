pack_id: conservative
description: Shorter TTLs and lower-impact action preferences.

ttl:
  default_minutes: 20
  p0_max_minutes: 20
  p1_max_minutes: 20
  p2_max_minutes: 15
  p3_max_minutes: 10
  p4_max_minutes: 10
  null_route_max_minutes: 5

rate_limit_profiles:
  protect_critical_udp:
    description: Conservative untrusted UDP limit for critical services.
    abstract_rate: low
    applies_to:
      - udp
  public_web_low_priority:
    description: Reduce low-priority public web traffic.
    abstract_rate: low
    applies_to:
      - tcp

action_preferences:
  P0:
    - ALLOW_TRUSTED_SOURCES
    - PRIORITIZE
  P1:
    - ALLOW_TRUSTED_SOURCES
    - PRIORITIZE
  P2:
    - RATE_LIMIT
  P3:
    - RATE_LIMIT
  P4:
    - RATE_LIMIT

risk_defaults:
  TEMPORARY_NULL_ROUTE: CRITICAL
  DENY_UNTRUSTED: HIGH
  TEMPORARY_BLOCK_PORT: HIGH
  RATE_LIMIT_UNTRUSTED: MEDIUM
  RATE_LIMIT: MEDIUM
  SHED_LOW_PRIORITY: MEDIUM
  PRIORITIZE: LOW
  ALLOW_TRUSTED_SOURCES: LOW
  DEPRIORITIZE: MEDIUM
  CHALLENGE: MEDIUM
  MONITOR_ONLY: LOW

