[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cabinet-burst-envelope"
version = "0.2.0"
description = "Local-only review envelope estimator for one cabinet using PDU power and inlet-temperature telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "cabinet-burst-envelope contributors"}]
dependencies = [
  "typer>=0.12",
  "pydantic>=2",
  "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cabinet-burst-envelope = "cabinet_burst_envelope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
