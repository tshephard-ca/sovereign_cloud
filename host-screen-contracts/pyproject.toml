[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "host-screen-contracts"
version = "0.1.0"
description = "Extract reviewable API contract candidates from recorded 5250-style screen traces."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "host-screen-contracts contributors" }]
dependencies = [
  "typer>=0.9",
  "pydantic>=2",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
host-screen-contracts = "host_screen_contracts.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
host_screen_contracts = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
